<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ピクセルクエスト - レトロRPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0d0c11;
            font-family: 'DotGothic16', monospace;
            color: #f3efe6;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            height: 100dvh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: max(4px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(4px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
            max-width: 520px;
            margin: 0 auto;
            overflow: hidden;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .pixel-box {
            border: 3px solid #2a2838;
            box-shadow: inset 2px 2px 0 #434059, inset -2px -2px 0 #181622, 3px 3px 0 rgba(0,0,0,0.7);
            background: #15141c;
        }
        .pixel-box-sm {
            border: 2px solid #2a2838;
            box-shadow: inset 1px 1px 0 #434059, inset -1px -1px 0 #181622;
            background: #1b1924;
        }
        .pixel-btn {
            border: 3px solid #434059;
            box-shadow: inset 2px 2px 0 #6b678c, inset -2px -2px 0 #2a2838, 3px 3px 0 rgba(0,0,0,0.5);
            background: #2b283a;
            transition: transform 0.05s, background 0.05s;
        }
        .pixel-btn:active, .pixel-btn.pressed {
            transform: translate(2px, 2px);
            box-shadow: inset 2px 2px 0 #181622, inset -2px -2px 0 #434059, 1px 1px 0 rgba(0,0,0,0.5);
            background: #201e2c;
        }
        /* D-Pad 重なり解消：間隔をしっかり確保 */
        .dpad-btn {
            width: 64px;
            height: 64px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .dpad-grid {
            display: grid;
            grid-template-columns: 64px 64px 64px;
            grid-template-rows: 64px 64px;
            gap: 8px; /* ここが重要。重なり防止 */
            justify-content: center;
        }
        /* オーバーレイ用：白い枠線で背景と差別化 */
        .modal-overlay {
            border: 2px solid #e8e6f0;
            box-shadow: 0 0 0 1px #2a2838, 0 4px 20px rgba(0,0,0,0.8);
            background: rgba(18, 17, 24, 0.96);
        }
        #log-area {
            max-height: 68px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.35;
        }
        @media (min-width: 640px) {
            body { max-width: 900px; padding: 10px; }
            .dpad-btn { width: 56px; height: 56px; font-size: 20px; }
            .dpad-grid {
                grid-template-columns: 56px 56px 56px;
                grid-template-rows: 56px 56px;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="pixel-box p-2 flex justify-between items-center shrink-0 mb-1.5">
        <div class="flex items-center gap-2">
            <div class="w-7 h-7 bg-[#c23b22] border-2 border-[#f3efe6] flex items-center justify-center text-sm">⚔️</div>
            <div>
                <div class="text-sm text-[#f39c38] font-bold tracking-wider">PIXEL QUEST</div>
                <div class="text-[9px] text-[#8c88a3]">本格レトロダンジョンRPG</div>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <div id="floor-indicator" class="pixel-box-sm px-2 py-1 text-[#3ec9c9] text-xs font-bold">地下 1 階</div>
            <button onclick="toggleSound()" id="sound-btn" class="pixel-btn px-2 py-1 text-xs">🔊 ON</button>
        </div>
    </header>

    <!-- メイン -->
    <div class="main-layout flex-1 flex flex-col min-h-0 gap-1.5">

        <!-- マップ + D-Pad -->
        <section class="map-section pixel-box p-2 flex flex-col min-h-0 flex-[1.6]">
            <div class="flex justify-between items-center mb-1 shrink-0">
                <div id="view-title" class="text-xs font-bold text-[#f39c38]">地下ダンジョン 探索中</div>
                <div class="text-[10px] text-[#8c88a3]">位置: (<span id="pos-x">1</span>, <span id="pos-y">1</span>)</div>
            </div>

            <div id="canvas-container" class="relative flex-1 bg-[#0b0a10] border-2 border-[#2a2838] flex items-center justify-center min-h-[160px]">
                <canvas id="gameCanvas" width="320" height="320" class="max-w-full max-h-full object-contain" style="width:min(78vw,280px);height:min(78vw,280px);"></canvas>

                <!-- 戦闘オーバーレイ（白い枠線追加） -->
                <div id="battle-overlay" class="absolute inset-2 modal-overlay flex flex-col justify-between p-2.5 hidden z-10 rounded-sm">
                    <div class="flex justify-between items-center bg-[#1b1924] p-2 border border-[#2a2838]">
                        <div id="monster-name" class="text-[#e84848] font-bold text-xs">モンスターが現れた！</div>
                        <div class="text-[11px]">HP: <span id="monster-hp-text" class="text-[#e84848] font-bold">30/30</span></div>
                    </div>
                    <div class="flex flex-col items-center justify-center my-1">
                        <div id="monster-svg-container" class="w-14 h-14 mb-1 flex items-center justify-center bg-[#0b0a10] border-2 border-[#2a2838]"></div>
                        <div id="monster-flavor" class="text-[10px] text-[#8c88a3] text-center">魔物の気配が漂っている…</div>
                    </div>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="battleAction('attack')" class="pixel-btn text-[#e84848] font-bold py-2.5 text-xs">⚔️ たたかう</button>
                        <button onclick="battleAction('skill')" class="pixel-btn text-[#a852fb] font-bold py-2.5 text-xs">✨ 必殺技</button>
                        <button onclick="battleAction('potion')" class="pixel-btn text-[#3ebf73] font-bold py-2.5 text-xs">🧪 薬草</button>
                        <button onclick="battleAction('run')" class="pixel-btn text-[#8c88a3] font-bold py-2.5 text-xs">🏃 逃走</button>
                    </div>
                </div>

                <!-- その他オーバーレイも同じ白い枠線 -->
                <div id="shop-overlay" class="absolute inset-2 modal-overlay flex flex-col p-2.5 hidden z-20 rounded-sm">
                    <div class="flex justify-between items-center border-b border-[#2a2838] pb-1.5 mb-1.5">
                        <h3 class="text-[#f39c38] font-bold text-xs">🏪 道具屋</h3>
                        <button onclick="closeModal('shop-overlay')" class="pixel-btn px-2 py-1 text-xs">✕</button>
                    </div>
                    <div id="shop-balance" class="modal-balance flex justify-between items-center px-2.5 py-1.5 mb-2 shrink-0"></div>
                    <div id="shop-items-list" class="flex-1 overflow-y-auto space-y-1.5 text-xs"></div>
                </div>

                <div id="item-overlay" class="absolute inset-2 modal-overlay flex flex-col p-2.5 hidden z-20 rounded-sm">
                    <div class="flex justify-between items-center border-b border-[#2a2838] pb-1.5 mb-1.5">
                        <h3 class="text-[#3ebf73] font-bold text-xs">🎒 アイテム</h3>
                        <button onclick="closeModal('item-overlay')" class="pixel-btn px-2 py-1 text-xs">✕</button>
                    </div>
                    <div id="modal-inventory-list" class="flex-1 overflow-y-auto space-y-1.5 text-xs"></div>
                </div>

                <div id="equip-overlay" class="absolute inset-2 modal-overlay flex flex-col p-2.5 hidden z-20 rounded-sm">
                    <div class="flex justify-between items-center border-b border-[#2a2838] pb-1.5 mb-1.5">
                        <h3 class="text-[#f39c38] font-bold text-xs">🛡️ 装備変更</h3>
                        <button onclick="closeModal('equip-overlay')" class="pixel-btn px-2 py-1 text-xs">✕</button>
                    </div>
                    <div id="equip-balance" class="modal-balance flex justify-between items-center px-2.5 py-1.5 mb-2 shrink-0"></div>
                    <div id="modal-equip-list" class="flex-1 overflow-y-auto space-y-1.5 text-xs"></div>
                </div>

                <div id="action-overlay" class="absolute inset-2 modal-overlay flex flex-col p-2.5 hidden z-20 rounded-sm">
                    <div class="flex justify-between items-center border-b border-[#2a2838] pb-1.5 mb-2">
                        <h3 class="text-[#f39c38] font-bold text-xs">⚙️ アクション</h3>
                        <button onclick="closeModal('action-overlay')" class="pixel-btn px-2 py-1 text-xs">✕</button>
                    </div>
                    <div class="flex flex-col gap-2.5 flex-1 justify-center">
                        <button onclick="closeModal('action-overlay');openShop()" class="pixel-btn text-[#f39c38] font-bold py-3 text-sm">🏪 道具屋</button>
                        <button onclick="closeModal('action-overlay');openItemModal()" class="pixel-btn text-[#3ebf73] font-bold py-3 text-sm">🎒 アイテム</button>
                        <button onclick="closeModal('action-overlay');openEquipModal()" class="pixel-btn text-[#a852fb] font-bold py-3 text-sm">🛡️ 装備</button>
                    </div>
                </div>

                <div id="save-overlay" class="absolute inset-0 bg-[#121118]/95 flex items-center justify-center hidden z-30">
                    <div class="pixel-box p-4 text-center border-2 border-[#e8e6f0]">
                        <div class="text-xs text-[#3ebf73] font-bold mb-2">💾 セーブ中...</div>
                        <div class="text-2xl animate-bounce">⏳</div>
                    </div>
                </div>
            </div>

            <!-- D-Pad（重なり解消版） -->
            <div class="flex justify-center mt-2.5 shrink-0">
                <div class="dpad-grid">
                    <div></div>
                    <button class="pixel-btn dpad-btn" ontouchstart="handleDpad(0,-1,event)" onmousedown="handleDpad(0,-1,event)" ontouchend="releaseDpad(event)" onmouseup="releaseDpad(event)" onmouseleave="releaseDpad(event)">▲</button>
                    <div></div>
                    <button class="pixel-btn dpad-btn" ontouchstart="handleDpad(-1,0,event)" onmousedown="handleDpad(-1,0,event)" ontouchend="releaseDpad(event)" onmouseup="releaseDpad(event)" onmouseleave="releaseDpad(event)">◀</button>
                    <button class="pixel-btn dpad-btn" ontouchstart="handleDpad(0,1,event)" onmousedown="handleDpad(0,1,event)" ontouchend="releaseDpad(event)" onmouseup="releaseDpad(event)" onmouseleave="releaseDpad(event)">▼</button>
                    <button class="pixel-btn dpad-btn" ontouchstart="handleDpad(1,0,event)" onmousedown="handleDpad(1,0,event)" ontouchend="releaseDpad(event)" onmouseup="releaseDpad(event)" onmouseleave="releaseDpad(event)">▶</button>
                </div>
            </div>
        </section>

        <!-- ステータス -->
        <section class="status-section pixel-box p-2 shrink-0">
            <div class="flex justify-between items-center mb-1.5">
                <div class="flex items-center gap-2">
                    <input type="text" id="player-name-input" value="エリック" maxlength="8" class="bg-[#121118] border-2 border-[#434059] px-2 py-1 text-xs w-24 focus:outline-none focus:border-[#f39c38]">
                    <button onclick="updatePlayerName()" class="pixel-btn px-2 py-1 text-[10px] text-[#f39c38]">変更</button>
                </div>
                <span id="player-level" class="bg-[#1f382a] text-[#3ebf73] text-[10px] px-2 py-0.5 border border-[#3ebf73]/40 font-bold">Lv.1</span>
            </div>

            <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-[11px] mb-1.5">
                <div>
                    <div class="flex justify-between text-[10px]"><span class="text-[#e84848]">HP</span><span id="hp-text">50/50</span></div>
                    <div class="h-1.5 bg-[#121118] border border-[#2a2838] mt-0.5"><div id="hp-bar" class="h-full bg-[#e84848]" style="width:100%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px]"><span class="text-[#a852fb]">MP</span><span id="mp-text">20/20</span></div>
                    <div class="h-1.5 bg-[#121118] border border-[#2a2838] mt-0.5"><div id="mp-bar" class="h-full bg-[#a852fb]" style="width:100%"></div></div>
                </div>
            </div>

            <div class="flex justify-between text-[11px] mb-1">
                <span>攻撃 <span id="atk-text" class="text-[#e84848]">12</span></span>
                <span>防御 <span id="def-text" class="text-[#3ec9c9]">5</span></span>
                <span>所持金 <span id="gold-text" class="text-[#f1c40f]">100G</span></span>
            </div>

            <div class="text-[10px] text-[#8c88a3] mb-1.5">
                武器: <span id="weapon-text" class="text-[#f39c38]">ヒノキの棒(+0)</span> /
                防具: <span id="armor-text" class="text-[#3ec9c9]">布の服(+0)</span>
            </div>

            <div class="grid grid-cols-2 gap-1.5">
                <button onclick="openActionMenu()" class="pixel-btn text-[#f39c38] font-bold py-2 text-xs">⚙️ アクション</button>
                <button onclick="saveGame()" class="pixel-btn text-[#3ec9c9] font-bold py-2 text-xs">💾 セーブ</button>
            </div>
        </section>
    </div>

    <!-- ログ -->
    <section id="log-section" class="pixel-box p-2 mt-1.5 shrink-0">
        <div class="flex justify-between items-center mb-1">
            <div class="text-[11px] text-[#f39c38] font-bold">📜 冒険の記録</div>
            <button onclick="clearLog()" class="text-[10px] text-[#8c88a3]">消去</button>
        </div>
        <div id="log-area"></div>
    </section>

<script>
const MAP_WIDTH = 11, MAP_HEIGHT = 11, TILE_SIZE = 29;
let canvas, ctx, mapData = [], currentFloor = 1, gameState = 0, soundEnabled = true, currentMonster = null;

const player = {
    name: "エリック", x: 1, y: 1, level: 1,
    hp: 50, maxHp: 50, mp: 20, maxMp: 20,
    exp: 0, nextExp: 30, atk: 12, def: 5, gold: 100, potions: 2,
    weapon: { name: "ヒノキの棒", atkBonus: 0 },
    armor: { name: "布の服", defBonus: 0 },
    ownedWeapons: ["ヒノキの棒"],
    ownedArmors: ["布の服"]
};

window.onload = () => {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    loadGame();
    generateMap();
    drawMap();
    updateStatsUI();
    logMessage("== レトロクエストへようこそ ==");
    logMessage("地下1階の探索が始まります。階段を見つけて最深部を目指せ！");
};

let lastMoveTime = 0;
function handleDpad(dx, dy, e) {
    if (e) {
        e.preventDefault();
        e.stopPropagation();
        if (e.currentTarget) e.currentTarget.classList.add('pressed');
    }
    const now = Date.now();
    if (now - lastMoveTime < 130) return;
    lastMoveTime = now;
    movePlayer(dx, dy);
}
function releaseDpad(e) {
    if (e?.currentTarget) e.currentTarget.classList.remove('pressed');
}

function generateMap() {
    mapData = [];
    for (let y = 0; y < MAP_HEIGHT; y++) {
        let row = [];
        for (let x = 0; x < MAP_WIDTH; x++) {
            if (x === 0 || y === 0 || x === MAP_WIDTH-1 || y === MAP_HEIGHT-1) row.push(1);
            else {
                const r = Math.random();
                if (r < 0.13) row.push(1);
                else if (r < 0.20) row.push(3);
                else if (r < 0.27) row.push(4);
                else row.push(0);
            }
        }
        mapData.push(row);
    }
    mapData[1][1] = mapData[1][2] = mapData[2][1] = mapData[2][2] = 0;

    const reachable = new Set(), queue = [{x:1,y:1}], visited = new Set(['1,1']);
    const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
    while (queue.length) {
        const {x,y} = queue.shift();
        reachable.add(`${x},${y}`);
        for (const [dx,dy] of dirs) {
            const nx = x+dx, ny = y+dy, key = `${nx},${ny}`;
            if (nx>0 && nx<MAP_WIDTH-1 && ny>0 && ny<MAP_HEIGHT-1 && mapData[ny][nx]!==1 && !visited.has(key)) {
                visited.add(key); queue.push({x:nx,y:ny});
            }
        }
    }
    const candidates = [];
    for (let y=1; y<MAP_HEIGHT-1; y++) for (let x=1; x<MAP_WIDTH-1; x++) {
        if (mapData[y][x]!==1 && !(x===1&&y===1) && reachable.has(`${x},${y}`)) candidates.push({x,y});
    }
    if (candidates.length) {
        const s = candidates[Math.floor(Math.random()*candidates.length)];
        mapData[s.y][s.x] = 2;
    } else {
        mapData[MAP_HEIGHT-2][MAP_WIDTH-2] = 2;
    }
}

function drawMap() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for (let y=0; y<MAP_HEIGHT; y++) for (let x=0; x<MAP_WIDTH; x++) {
        const tile = mapData[y][x], px = x*TILE_SIZE, py = y*TILE_SIZE;
        ctx.fillStyle = '#14121c';
        ctx.fillRect(px,py,TILE_SIZE,TILE_SIZE);
        ctx.strokeStyle = '#221f2e';
        ctx.strokeRect(px+0.5,py+0.5,TILE_SIZE-1,TILE_SIZE-1);
        if (tile===1) {
            ctx.fillStyle = '#2a2838'; ctx.fillRect(px+2,py+2,TILE_SIZE-4,TILE_SIZE-4);
            ctx.fillStyle = '#434059'; ctx.fillRect(px+6,py+6,TILE_SIZE-12,TILE_SIZE-12);
        } else if (tile===2) { ctx.font='18px monospace'; ctx.fillText('🪜',px+5,py+22); }
        else if (tile===3) { ctx.font='16px monospace'; ctx.fillText('📦',px+6,py+22); }
        else if (tile===4) { ctx.fillStyle='rgba(232,72,72,0.18)'; ctx.fillRect(px+3,py+3,TILE_SIZE-6,TILE_SIZE-6); }
    }
    const ppx = player.x*TILE_SIZE, ppy = player.y*TILE_SIZE;
    ctx.fillStyle = '#3ebf73';
    ctx.beginPath(); ctx.arc(ppx+TILE_SIZE/2, ppy+TILE_SIZE/2, 10, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1d5e3c'; ctx.lineWidth=2; ctx.stroke();
    ctx.font = '15px monospace'; ctx.fillText('🧙‍♂️', ppx+5, ppy+22);
}

function movePlayer(dx, dy) {
    if (gameState !== 0) return;
    const nx = player.x + dx, ny = player.y + dy;
    if (nx<0 || nx>=MAP_WIDTH || ny<0 || ny>=MAP_HEIGHT) return;
    if (mapData[ny][nx] === 1) {
        logMessage("壁に阻まれた。");
        return;
    }
    player.x = nx; player.y = ny;
    playSound('step');
    document.getElementById('pos-x').textContent = nx;
    document.getElementById('pos-y').textContent = ny;

    const tile = mapData[ny][nx];
    if (tile === 2) {
        currentFloor++;
        document.getElementById('floor-indicator').textContent = `地下 ${currentFloor} 階`;
        logMessage(`🎉 地下 ${currentFloor} 階へ下りた！`);
        playSound('level_up');
        generateMap();
        player.x = 1; player.y = 1;
        document.getElementById('pos-x').textContent = 1;
        document.getElementById('pos-y').textContent = 1;
    } else if (tile === 3) {
        mapData[ny][nx] = 0;
        const gold = Math.floor(Math.random()*25*currentFloor) + 18;
        player.gold += gold;
        let msg = `📦 宝箱！ ${gold}G 入手`;
        if (Math.random() < 0.3) { player.potions++; msg += " ＋薬草"; playSound('item'); }
        else playSound('victory');
        logMessage(msg);
    } else if (tile === 4 || Math.random() < 0.19) {
        if (tile === 4) mapData[ny][nx] = 0;
        startBattle();
    }
    updateStatsUI();
    drawMap();
}

const monsterRoster = [
    {name:"どくスライム",hp:22,maxHp:22,atk:9,def:2,exp:14,gold:16,flavor:"ネバネバした猛毒の魔物。",svg:`<svg width="40" height="40" viewBox="0 0 16 16"><path fill="#3ebf73" d="M3 10h10v3H3z"/><path fill="#3ec9c9" d="M4 7h8v3H4z"/><circle cx="6" cy="8" r="1" fill="#000"/><circle cx="10" cy="8" r="1" fill="#000"/></svg>`},
    {name:"いたずらゴブリン",hp:36,maxHp:36,atk:15,def:4,exp:24,gold:32,flavor:"小回りの利く小鬼。",svg:`<svg width="40" height="40" viewBox="0 0 16 16"><path fill="#c23b22" d="M5 4h6v2H5z"/><path fill="#f39c38" d="M3 6h10v6H3z"/><circle cx="5" cy="8" r="1.5" fill="#ffeb3b"/><circle cx="11" cy="8" r="1.5" fill="#ffeb3b"/></svg>`},
    {name:"アイアンオーク",hp:55,maxHp:55,atk:21,def:7,exp:40,gold:55,flavor:"鉄の鎧をまとった獣人。",svg:`<svg width="40" height="40" viewBox="0 0 16 16"><path fill="#7c78b8" d="M3 3h10v4H3z"/><path fill="#434059" d="M4 7h8v6H4z"/></svg>`},
    {name:"深淵のワイバーン",hp:95,maxHp:95,atk:30,def:11,exp:85,gold:130,flavor:"地下を支配する古代竜。",svg:`<svg width="40" height="40" viewBox="0 0 16 16"><path fill="#a852fb" d="M2 5l6-3 6 3-3 5H5z"/><path fill="#c23b22" d="M6 9h4v4H6z"/></svg>`}
];

function startBattle() {
    gameState = 1;
    let available = monsterRoster.slice(0, Math.min(currentFloor+1, monsterRoster.length));
    if (currentFloor % 5 === 0 && Math.random() < 0.5) {
        currentMonster = JSON.parse(JSON.stringify(monsterRoster[3]));
        currentMonster.name = "【ボス】" + currentMonster.name;
    } else {
        const t = available[Math.floor(Math.random()*available.length)];
        currentMonster = JSON.parse(JSON.stringify(t));
        currentMonster.hp = Math.round(currentMonster.hp * (1 + (currentFloor-1)*0.22));
        currentMonster.maxHp = currentMonster.hp;
        currentMonster.atk = Math.round(currentMonster.atk * (1 + (currentFloor-1)*0.14));
    }
    document.getElementById('monster-name').textContent = `${currentMonster.name} があらわれた！`;
    document.getElementById('monster-hp-text').textContent = `${currentMonster.hp}/${currentMonster.maxHp}`;
    document.getElementById('monster-flavor').textContent = currentMonster.flavor;
    document.getElementById('monster-svg-container').innerHTML = currentMonster.svg;
    document.getElementById('battle-overlay').classList.remove('hidden');
    document.getElementById('view-title').textContent = "⚠️ 戦闘中";
    logMessage(`⚠️ ${currentMonster.name} と遭遇！`);
    playSound('hit');
}

function battleAction(action) {
    if (gameState !== 1) return;
    const pAtk = player.atk + player.weapon.atkBonus;
    const pDef = player.def + player.armor.defBonus;

    if (action === 'attack') {
        const dmg = Math.max(1, pAtk - currentMonster.def + Math.floor(Math.random()*4));
        currentMonster.hp = Math.max(0, currentMonster.hp - dmg);
        logMessage(`⚔️ ${dmg} ダメージ！`);
        playSound('hit');
    } else if (action === 'skill') {
        if (player.mp < 8) { logMessage("MP不足！"); return; }
        player.mp -= 8;
        const dmg = Math.max(1, Math.round(pAtk*1.7) - currentMonster.def);
        currentMonster.hp = Math.max(0, currentMonster.hp - dmg);
        logMessage(`✨ 必殺技！ ${dmg} ダメージ！`);
        playSound('victory');
    } else if (action === 'potion') {
        if (player.potions > 0) {
            player.potions--;
            player.hp = Math.min(player.maxHp, player.hp + 40);
            logMessage(`🧪 薬草使用 (残${player.potions})`);
            playSound('item');
            updateStatsUI();
        } else logMessage("薬草がない！");
        return;
    } else if (action === 'run') {
        if (Math.random() < 0.65) {
            logMessage("🏃 逃走成功！");
            endBattle();
            return;
        } else logMessage("逃走失敗！");
    }

    document.getElementById('monster-hp-text').textContent = `${currentMonster.hp}/${currentMonster.maxHp}`;

    if (currentMonster.hp <= 0) {
        logMessage(`🏆 ${currentMonster.name} を倒した！`);
        player.exp += currentMonster.exp;
        player.gold += currentMonster.gold;
        logMessage(`EXP+${currentMonster.exp}  Gold+${currentMonster.gold}`);
        playSound('victory');
        checkLevelUp();
        endBattle();
        return;
    }

    const mDmg = Math.max(1, currentMonster.atk - pDef + Math.floor(Math.random()*4));
    player.hp = Math.max(0, player.hp - mDmg);
    logMessage(`💥 敵の攻撃！ ${mDmg} ダメージ`);
    playSound('hit');
    updateStatsUI();

    if (player.hp <= 0) {
        logMessage("💀 力尽きた… 所持金半分、地下1階に戻される");
        player.gold = Math.floor(player.gold / 2);
        player.hp = player.maxHp;
        player.mp = player.maxMp;
        currentFloor = 1;
        document.getElementById('floor-indicator').textContent = "地下 1 階";
        generateMap();
        player.x = 1; player.y = 1;
        endBattle();
    }
}

function endBattle() {
    gameState = 0;
    document.getElementById('battle-overlay').classList.add('hidden');
    document.getElementById('view-title').textContent = "地下ダンジョン 探索中";
    updateStatsUI();
    drawMap();
}

function checkLevelUp() {
    while (player.exp >= player.nextExp) {
        player.exp -= player.nextExp;
        player.level++;
        player.maxHp += 12; player.hp = player.maxHp;
        player.maxMp += 4; player.mp = player.maxMp;
        player.atk += 3; player.def += 2;
        player.nextExp = Math.floor(player.nextExp * 1.45);
        logMessage(`🎊 レベルアップ！ Lv.${player.level}`);
        playSound('level_up');
    }
}

function updateStatsUI() {
    document.getElementById('player-level').textContent = `Lv.${player.level}`;
    document.getElementById('hp-text').textContent = `${player.hp}/${player.maxHp}`;
    document.getElementById('hp-bar').style.width = `${(player.hp/player.maxHp)*100}%`;
    document.getElementById('mp-text').textContent = `${player.mp}/${player.maxMp}`;
    document.getElementById('mp-bar').style.width = `${(player.mp/player.maxMp)*100}%`;
    document.getElementById('atk-text').textContent = player.atk + player.weapon.atkBonus;
    document.getElementById('def-text').textContent = player.def + player.armor.defBonus;
    document.getElementById('gold-text').textContent = `${player.gold}G`;
    document.getElementById('weapon-text').textContent = `${player.weapon.name}(+${player.weapon.atkBonus})`;
    document.getElementById('armor-text').textContent = `${player.armor.name}(+${player.armor.defBonus})`;
}

function logMessage(msg) {
    const area = document.getElementById('log-area');
    const div = document.createElement('div');
    div.textContent = msg;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
    while (area.children.length > 25) area.removeChild(area.firstChild);
}
function clearLog() { document.getElementById('log-area').innerHTML = ''; }

function updatePlayerName() {
    const name = document.getElementById('player-name-input').value.trim() || "エリック";
    player.name = name;
    logMessage(`名前を「${name}」に変更`);
}

function openActionMenu() {
    if (gameState !== 0) return;
    document.getElementById('action-overlay').classList.remove('hidden');
}
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

const weaponShop = [
    {name:"ヒノキの棒",atkBonus:0,price:0},
    {name:"鉄の剣",atkBonus:8,price:120},
    {name:"鋼の大剣",atkBonus:18,price:350}
];

const armorShop = [
    {name:"布の服",defBonus:0,price:0},
    {name:"革の鎧",defBonus:6,price:100},
    {name:"鋼の鎧",defBonus:14,price:300}
];

function ensureEquipmentData() {
    if (!Array.isArray(player.ownedWeapons)) player.ownedWeapons = ["ヒノキの棒"];
    if (!Array.isArray(player.ownedArmors)) player.ownedArmors = ["布の服"];
    if (!player.ownedWeapons.includes("ヒノキの棒")) player.ownedWeapons.unshift("ヒノキの棒");
    if (!player.ownedArmors.includes("布の服")) player.ownedArmors.unshift("布の服");
}

function renderBalance(targetId) {
    document.getElementById(targetId).innerHTML = `
        <span class="text-[#8c88a3]">現在の残高</span>
        <span class="text-[#f1c40f] font-bold text-sm">${player.gold}G</span>
    `;
}

function openShop() {
    ensureEquipmentData();
    renderBalance('shop-balance');
    const weaponRows = weaponShop.map((w, i) => {
        const equipped = player.weapon.name === w.name;
        const owned = player.ownedWeapons.includes(w.name);
        const right = equipped
            ? `<span class="equipped-badge">E</span>`
            : owned
                ? `<button onclick="equipWeapon(${i})" class="pixel-btn px-2 py-1 text-[10px] text-[#3ec9c9]">装備</button>`
                : `<button onclick="buy('w',${i})" class="pixel-btn px-2 py-1 text-[10px]">${w.price}G</button>`;
        return `<div class="pixel-box-sm shop-row p-2 flex justify-between items-center gap-2"><span>⚔️ ${w.name} (+${w.atkBonus})${equipped ? '<span class="equipped-badge">E</span>' : ''}</span><span class="flex items-center gap-1">${right}</span></div>`;
    }).join('');

    const armorRows = armorShop.map((a, i) => {
        const equipped = player.armor.name === a.name;
        const owned = player.ownedArmors.includes(a.name);
        const right = equipped
            ? `<span class="equipped-badge">E</span>`
            : owned
                ? `<button onclick="equipArmor(${i})" class="pixel-btn px-2 py-1 text-[10px] text-[#3ec9c9]">装備</button>`
                : `<button onclick="buy('a',${i})" class="pixel-btn px-2 py-1 text-[10px]">${a.price}G</button>`;
        return `<div class="pixel-box-sm shop-row p-2 flex justify-between items-center gap-2"><span>🛡️ ${a.name} (+${a.defBonus})${equipped ? '<span class="equipped-badge">E</span>' : ''}</span><span class="flex items-center gap-1">${right}</span></div>`;
    }).join('');

    document.getElementById('shop-items-list').innerHTML = `
        <div class="text-[#f39c38] font-bold mb-1">武器</div>
        <div class="space-y-1.5">${weaponRows}</div>
        <div class="text-[#3ec9c9] font-bold mt-3 mb-1">防具</div>
        <div class="space-y-1.5">${armorRows}</div>
        <div class="text-[#3ebf73] font-bold mt-3 mb-1">道具</div>
        <div class="pixel-box-sm shop-row p-2 flex justify-between items-center">
            <span>🌿 薬草 × ${player.potions}</span>
            <button onclick="buy('p')" class="pixel-btn px-2 py-1 text-[10px]">30G</button>
        </div>
    `;
    document.getElementById('shop-overlay').classList.remove('hidden');
}

function buy(type, idx) {
    ensureEquipmentData();

    if (type === 'p') {
        if (player.gold >= 30) {
            player.gold -= 30;
            player.potions++;
            logMessage("薬草購入");
            playSound('item');
        } else logMessage("ゴールド不足");
    } else if (type === 'w') {
        const w = weaponShop[idx];
        if (!w) return;
        if (player.ownedWeapons.includes(w.name)) {
            equipWeapon(idx);
            return;
        }
        if (player.gold >= w.price) {
            player.gold -= w.price;
            player.ownedWeapons.push(w.name);
            player.weapon = {name:w.name,atkBonus:w.atkBonus};
            logMessage(`${w.name}を購入して装備`);
            playSound('item');
        } else logMessage("ゴールド不足");
    } else if (type === 'a') {
        const a = armorShop[idx];
        if (!a) return;
        if (player.ownedArmors.includes(a.name)) {
            equipArmor(idx);
            return;
        }
        if (player.gold >= a.price) {
            player.gold -= a.price;
            player.ownedArmors.push(a.name);
            player.armor = {name:a.name,defBonus:a.defBonus};
            logMessage(`${a.name}を購入して装備`);
            playSound('item');
        } else logMessage("ゴールド不足");
    }

    updateStatsUI();
    if (!document.getElementById('shop-overlay').classList.contains('hidden')) openShop();
}

function equipWeapon(idx) {
    ensureEquipmentData();
    const w = weaponShop[idx];
    if (!w || !player.ownedWeapons.includes(w.name)) return;
    player.weapon = {name:w.name,atkBonus:w.atkBonus};
    logMessage(`${w.name}を装備`);
    playSound('item');
    updateStatsUI();
    if (!document.getElementById('shop-overlay').classList.contains('hidden')) openShop();
    if (!document.getElementById('equip-overlay').classList.contains('hidden')) openEquipModal();
}

function equipArmor(idx) {
    ensureEquipmentData();
    const a = armorShop[idx];
    if (!a || !player.ownedArmors.includes(a.name)) return;
    player.armor = {name:a.name,defBonus:a.defBonus};
    logMessage(`${a.name}を装備`);
    playSound('item');
    updateStatsUI();
    if (!document.getElementById('shop-overlay').classList.contains('hidden')) openShop();
    if (!document.getElementById('equip-overlay').classList.contains('hidden')) openEquipModal();
}

function openItemModal() {
    document.getElementById('modal-inventory-list').innerHTML = `
        <div class="pixel-box-sm p-2 flex justify-between items-center">
            <span>薬草 × ${player.potions}</span>
            <button onclick="usePotion()" class="pixel-btn px-2 py-0.5 text-[10px]">使用</button>
        </div>`;
    document.getElementById('item-overlay').classList.remove('hidden');
}
function usePotion() {
    if (player.potions > 0) {
        player.potions--;
        player.hp = Math.min(player.maxHp, player.hp + 40);
        logMessage(`薬草使用 (残${player.potions})`);
        playSound('item');
        updateStatsUI();
        openItemModal();
    } else logMessage("薬草がない");
}

function openEquipModal() {
    ensureEquipmentData();
    renderBalance('equip-balance');

    const weapons = player.ownedWeapons.map(name => {
        const i = weaponShop.findIndex(w => w.name === name);
        const w = weaponShop[i];
        if (!w) return '';
        const equipped = player.weapon.name === w.name;
        return `
            <div class="pixel-box-sm equip-row p-2 flex justify-between items-center gap-2">
                <span>⚔️ ${w.name} (+${w.atkBonus})${equipped ? '<span class="equipped-badge">E</span>' : ''}</span>
                ${equipped ? '<span class="text-[#f1c40f] text-[10px]">装備中</span>' : `<button onclick="equipWeapon(${i})" class="pixel-btn px-2 py-1 text-[10px] text-[#3ec9c9]">装備</button>`}
            </div>
        `;
    }).join('');

    const armors = player.ownedArmors.map(name => {
        const i = armorShop.findIndex(a => a.name === name);
        const a = armorShop[i];
        if (!a) return '';
        const equipped = player.armor.name === a.name;
        return `
            <div class="pixel-box-sm equip-row p-2 flex justify-between items-center gap-2">
                <span>🛡️ ${a.name} (+${a.defBonus})${equipped ? '<span class="equipped-badge">E</span>' : ''}</span>
                ${equipped ? '<span class="text-[#f1c40f] text-[10px]">装備中</span>' : `<button onclick="equipArmor(${i})" class="pixel-btn px-2 py-1 text-[10px] text-[#3ec9c9]">装備</button>`}
            </div>
        `;
    }).join('');

    document.getElementById('modal-equip-list').innerHTML = `
        <div class="text-[#f39c38] font-bold mb-1">武器</div>
        <div class="space-y-1.5">${weapons}</div>
        <div class="text-[#3ec9c9] font-bold mt-3 mb-1">防具</div>
        <div class="space-y-1.5">${armors}</div>
    `;
    document.getElementById('equip-overlay').classList.remove('hidden');
}

function saveGame() {
    document.getElementById('save-overlay').classList.remove('hidden');
    localStorage.setItem('pixelquest_save', JSON.stringify({player, currentFloor, mapData}));
    setTimeout(() => {
        document.getElementById('save-overlay').classList.add('hidden');
        logMessage("セーブ完了");
        playSound('item');
    }, 500);
}
function loadGame() {
    const raw = localStorage.getItem('pixelquest_save');
    if (raw) {
        try {
            const d = JSON.parse(raw);
            Object.assign(player, d.player);
            ensureEquipmentData();
            currentFloor = d.currentFloor || 1;
            if (d.mapData) mapData = d.mapData;
            document.getElementById('player-name-input').value = player.name;
            document.getElementById('floor-indicator').textContent = `地下 ${currentFloor} 階`;
        } catch(e){}
    }
}

function playSound(type) {
    if (!soundEnabled) return;
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator(), g = ac.createGain();
        o.connect(g); g.connect(ac.destination);
        if (type === 'step') { o.frequency.value=180; g.gain.value=0.03; o.start(); o.stop(ac.currentTime+0.04); }
        else if (type === 'hit') { o.frequency.value=120; g.gain.value=0.06; o.start(); o.stop(ac.currentTime+0.08); }
        else { o.frequency.value=440; g.gain.value=0.05; o.start(); setTimeout(()=>o.frequency.value=660,60); o.stop(ac.currentTime+0.15); }
    } catch(e){}
}
function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('sound-btn').textContent = soundEnabled ? "🔊 ON" : "🔇 OFF";
}
</script>
</body>
